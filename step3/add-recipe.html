<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>טופס הוספת מתכון</title>
    <link rel="stylesheet" href="add-recipe.css">
</head>

<body>
    <form action="#" method="get">
        <h1> הוספת מתכון </h1>
        
        <div class="field">
            <label for="title"> שם המתכון </label>
            <input type="text" id="title" name="title" placeholder=" למשל : עוגת תפוחים " required>
        </div>
        
        <fieldset>
            <legend> סוג המנה </legend>
            <div class="option">
                <span class="option">
                    <input type="radio" id="meat" name="kind" value="meat">
                    <label for="meat">בשרי </label>
                    <input type="radio" id="dairy" name="kind" value="dairy">
                    <label for="dairy">חלבי </label>
                    <input type="radio" id="parve" name="kind" value="parve">
                    <label for="parve">פרווה </label>
                </span>
            </div>
        </fieldset>
        
        <div class="row"> 
            <div class="field">
                <label for="category">קטגוריות</label>
                <select id="category" name="category">
                    <option>מרקים</option>
                    <option>עיקריות</option>
                    <option>סלטים</option>
                    <option>מאפים</option>
                    <option>קינוחים</option>
                </select>
            </div>
            <div class="field">
                <label for="time">זמן הכנה</label>
                <input type="time" id="time" name="time" required max="05:00" value="00:10">
            </div>
            <div class="field">
                <label for="servings">מספר מנות</label>
                <input type="number" id="servings" name="servings" value="4" max="50" min="1">
            </div>
        </div>

        <div class="field">
            <label for="ingredients">מצרכים</label>
            <textarea name="ingredients" id="ingredients" required rows="5"></textarea>
        </div>

        <div class="field">
            <label for="steps">אופן ההכנה</label>
            <textarea name="steps" id="steps" required rows="6"></textarea>
        </div>

        <fieldset>
            <legend>מתאים ל...</legend>
            <div class="option">
                <span class="option">
                    <input type="checkbox" id="holydays" name="suitable" value="holydays">
                    <label for="holydays">חגים </label>
                    <input type="checkbox" id="kids" name="suitable" value="kids">
                    <label for="kids">ילדים </label>
                    <input type="checkbox" id="quick" name="suitable" value="quick">
                    <label for="quick">הכנה מהירה </label>
                </span>
            </div>
        </fieldset>
        
        <div class="field">
            <input type="file" accept="image/*" name="recipe-image" id="recipe-image">
        </div>
        
        <div class="field">
            <button type="submit">שמירת המתכון</button>
        </div>
    </form>
</body>
</html>
